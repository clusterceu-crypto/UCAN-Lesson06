  <title id="svg-title">Від дренажу до водосвідомого міста</title>
  <desc id="svg-desc">Схема показує, що дренаж залишається частиною ширшого водосвідомого підходу, який розглядає водний ризик у контексті всієї міської системи.</desc>
  <metadata>
    Asset ID: L06-A01; Route: R03; Production: manual editable vector / SVG-first; AI: No.
    Root viewBox: 0 0 1200 800. Responsive vertical variant is stored as symbol #mobile-variant with viewBox 0 0 720 1080.
    Palette uses colors already present in the UCAN Brandbook document theme: dark blue #1F497D, green #76923C, light gray #D8D8D8, white #FFFFFF, turquoise #4BACC6.
  </metadata>
  <style>
    text { font-family: Arial, sans-serif; }
  </style>
  <defs>
    <symbol id="desktop-variant" viewBox="0 0 1200 800"><rect x="0" y="0" width="1200" height="800" fill="#FFFFFF"/><text x="60" y="78" font-size="42" font-weight="700" fill="#1F497D" text-anchor="start"><tspan x="60" dy="0">Від дренажу до водосвідомого міста</tspan></text><rect x="70" y="170" width="360" height="270" rx="22" fill="#FFFFFF" stroke="#1F497D" stroke-width="3"/><rect x="73" y="192" width="10" height="226" rx="5" fill="#1F497D"/><text x="108" y="230" font-size="30" font-weight="700" fill="#1F497D" text-anchor="start"><tspan x="108" dy="0">Підхід, зосереджений</tspan><tspan x="108" dy="37.5">лише на дренажі</tspan></text><text x="108" y="338" font-size="24" font-weight="400" fill="#1F497D" text-anchor="start"><tspan x="108" dy="0">Як швидше</tspan><tspan x="108" dy="30.0">відвести воду?</tspan></text><line x1="455" y1="305" x2="505" y2="305" stroke="#4BACC6" stroke-width="5" stroke-linecap="round"/><path d="M 505 305 L 486 292 L 486 318 Z" fill="#4BACC6"/><rect x="540" y="145" width="600" height="340" rx="26" fill="#FFFFFF" stroke="#76923C" stroke-width="4" stroke-linejoin="round"/><text x="585" y="220" font-size="30" font-weight="700" fill="#1F497D" text-anchor="start"><tspan x="585" dy="0">Водосвідомий підхід</tspan></text><text x="585" y="285" font-size="24" font-weight="400" fill="#1F497D" text-anchor="start"><tspan x="585" dy="0">Як управляти водним ризиком</tspan><tspan x="585" dy="30.0">у міській системі?</tspan></text><rect x="625" y="350" width="430" height="90" rx="18" fill="#D8D8D8" stroke="#1F497D" stroke-width="2"/><text x="840" y="384" font-size="21" font-weight="700" fill="#1F497D" text-anchor="middle"><tspan x="840" dy="0">Підхід, зосереджений лише</tspan><tspan x="840" dy="26.25">на дренажі</tspan></text><line x1="70" y1="555" x2="1140" y2="555" stroke="#4BACC6" stroke-width="4" stroke-linecap="round"/><text x="70" y="610" font-size="22" font-weight="600" fill="#1F497D" text-anchor="start"><tspan x="70" dy="0">Дренаж — це частина системи. Водосвідомий підхід — це спосіб</tspan><tspan x="70" dy="27.5">управляти водним ризиком у ширшому міському контексті.</tspan></text></symbol>
